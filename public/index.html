      content="Pide pizza online en tu pizzeria local. Elige recogida o delivery y completa tu pedido en linea."
    />

      manifest.json provides metadata used when your web app is installed on a

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      (function () {
        var host = window.location.hostname.toLowerCase();
        if (host === "mycrushpizza.com" || host === "www.mycrushpizza.com") {
          window.location.replace("https://voltapizza.com/mycrushpizza");
        } else if (host === "juego.mycrushpizza.com") {
          window.location.replace("https://voltapizza.com/mycrushpizza/coupons");
        }
      })();
    </script>

      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Pide pizza online</title>
